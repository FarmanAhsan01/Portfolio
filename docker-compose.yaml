services:

  postgres:
    image: postgres:17
    container_name: portfolio-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Farman@123
      POSTGRES_DB: portfolio_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: portfolio-backend

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Farman%40123@postgres:5432/portfolio_db

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: